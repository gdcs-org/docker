services:
  xb10-dev:
    platform: linux/arm64
    privileged: true
    tty: true
    hostname: xb10-dev
    container_name: xb10-dev
    image: ghcr.io/gdcs-org/dev/xb10:latest 
    volumes:
      - ~/bin:/home/root/bin:ro,z
      - ~/git-credentials:/home/root/.git-credentials:ro,z
      - ~/gitconfig:/home/root/.gitconfig:ro,z
      - ~/ssh:/home/root/.ssh:ro,z

